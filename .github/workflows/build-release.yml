name: Build BabelBrain (cross-platform)

# Triggers:
#   - push of a tag starting with "v" (e.g. v0.8.2) -> full release build + draft GitHub Release
#   - manual dispatch from the Actions tab          -> build only (no release published)
# Releases are always created as drafts so we can add notes before publishing.
#
# What each build now produces (per platform):
#   * The Hub launcher, packaged as the user-facing installer (DMG on macOS,
#     Inno Setup .exe on Windows). The Hub carries a read-only "bundled" copy of
#     this build's BabelBrain so a fresh install works offline.
#   * A relocatable <artifact>-version.zip of just the BabelBrain version, plus a
#     .sha256, which the Hub downloads to add/swap versions. Add these to the
#     curated releases.json (see Hub/gen_manifest_entry.py) to make the version
#     appear in the launcher.
on:
  push:
    tags:
      - 'v*'        # production releases (publishes a GitHub Release)
      - 'test-*'    # iteration/test builds (artifacts only, no Release)
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a draft GitHub Release with the artifacts'
        type: boolean
        default: false

permissions:
  contents: write   # needed to create the GitHub Release on tag push

env:
  # Run JavaScript-based actions (actions/checkout, actions/upload-artifact,
  # actions/download-artifact, mamba-org/setup-micromamba, …) on the Node.js 24
  # runtime instead of the deprecated Node.js 20. This clears the
  # "Node.js 20 actions are deprecated" warning for all of them at once, ahead
  # of GitHub forcing Node 24 by default on 2026-06-16 (Node 20 is removed from
  # runners on 2026-09-16). No action-version bumps needed; their JS is
  # compatible with Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build on ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS-arm64
            os: macos-14
            env_file: environment_mac_arm64-314.yml
            artifact_name: BabelBrain-macOS-arm64
          # - label: macOS-x64
          #   # GitHub retired macos-13 (Intel) runners, so this build now
          #   # cross-compiles on arm64 hardware via Rosetta 2. CONDA_SUBDIR=osx-64
          #   # forces conda to fetch x86_64 packages; the resulting .app is
          #   # x86_64 and runs natively on Intel Macs (and via Rosetta on Apple
          #   # Silicon for users who want it).
          #   os: macos-latest
          #   conda_subdir: osx-64
          #   env_file: environment_mac_x64-314.yml
          #   artifact_name: BabelBrain-macOS-x64
          # - label: Windows-x64
          #   os: windows-latest
          #   env_file: environment_win-314-NoHash.yml
          #   artifact_name: BabelBrain-Windows-x64

    defaults:
      run:
        # micromamba activates the env in this shell on every step
        shell: bash -el {0}

    steps:
      - name: Checkout
        # Shallow, single-branch checkout (the default). The build reads the
        # version from BabelBrain/version.txt and the release is driven by the
        # GitHub ref, so full history isn't needed. fetch-depth: 0 used to pull
        # in ALL branches, which on the case-insensitive macOS/Windows runners
        # triggered git's "case-insensitive filesystem" warning because the
        # remote has two branches differing only in case (MLX vs mlx).
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Rosetta 2 (cross-arch x86_64 build on Apple Silicon)
        if: runner.os == 'macOS' && matrix.conda_subdir == 'osx-64'
        run: |
          softwareupdate --install-rosetta --agree-to-license

      - name: Configure CONDA_SUBDIR for cross-arch builds
        # Only set CONDA_SUBDIR when actually doing a cross-arch build.
        # Setting it to an empty string (e.g. via env: CONDA_SUBDIR: ${{ matrix.conda_subdir }}
        # when the matrix value is unset) makes libmamba treat it as
        # "no platform subdir" — it then only fetches noarch/ and silently
        # fails to find any platform-specific package (python, numpy, ...).
        if: matrix.conda_subdir != ''
        run: echo "CONDA_SUBDIR=${{ matrix.conda_subdir }}" >> "$GITHUB_ENV"

      - name: Set up micromamba + create env
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: ${{ matrix.env_file }}
          environment-name: babelbrain
          init-shell: bash
          cache-environment: true
          cache-downloads: true
          # Skip the post-job cleanup step. On Windows the action's bash
          # auto-activation line is never written to .bash_profile, so the
          # cleanup fails with "Could not find micromamba activate babelbrain"
          # and marks the whole job failed. The runner VM is ephemeral so
          # there's no real cleanup needed anyway.
          post-cleanup: none

      - name: Show toolchain
        run: |
          python --version
          pip --version
          which pyinstaller || true
          pyinstaller --version

      # --------------------------------------------------------------------
      # Build metadata: derive the channel + tag from the git ref, then stamp a
      # build_info.json the Hub uses to identify this build by (version, commit).
      #   refs/tags/v*     -> stable release
      #   refs/tags/test-* -> prerelease (test build)
      #   manual dispatch  -> dev
      # --------------------------------------------------------------------
      - name: Compute build metadata
        run: |
          REF="${GITHUB_REF:-}"
          if [[ "$REF" == refs/tags/v* ]]; then
            echo "BABEL_CHANNEL=stable"   >> "$GITHUB_ENV"
            echo "BABEL_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          elif [[ "$REF" == refs/tags/test-* ]]; then
            echo "BABEL_CHANNEL=prerelease" >> "$GITHUB_ENV"
            echo "BABEL_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "BABEL_CHANNEL=dev" >> "$GITHUB_ENV"
            echo "BABEL_TAG=" >> "$GITHUB_ENV"
          fi

      - name: Build BabelBrain version (PyInstaller) + stamp build_info
        working-directory: BabelBrain
        run: |
          python Hub/gen_build_info.py --channel "$BABEL_CHANNEL" \
            ${BABEL_TAG:+--tag "$BABEL_TAG"} --out build_info.json
          cat build_info.json
          # Build the real BabelBrain into its own dist/work paths so the Hub
          # build below (same BabelBrain.app name) does not collide with it.
          pyinstaller BabelBrain.spec --noconfirm --clean \
            --distpath dist/version --workpath build/version
          # Stamp the identity where the Hub looks for it.
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            cp build_info.json "dist/version/BabelBrain.app/Contents/Resources/build_info.json"
          else
            cp build_info.json "dist/version/BabelBrain/build_info.json"
          fi

      # --------------------------------------------------------------------
      # macOS signing/notarization. The VERSION app is signed + notarized +
      # stapled first (so the standalone -version.zip the Hub downloads is
      # itself notarized), then nested into the Hub, then the Hub is signed +
      # notarized as the shipped installer.
      # Required repo secrets (signing is skipped if MACOS_CERT_P12_BASE64 is unset):
      #   MACOS_CERT_P12_BASE64 / _PASSWORD, MACOS_SIGN_IDENTITY,
      #   MACOS_INSTALLER_SIGN_IDENTITY, MACOS_NOTARY_APPLE_ID / _TEAM_ID / _APP_PASSWORD
      # If signing secrets are absent, an unsigned DMG is still produced for
      # pipeline testing.
      # --------------------------------------------------------------------
      - name: Import signing certificate (macOS)
        if: runner.os == 'macOS'
        env:
          P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "::warning::MACOS_CERT_P12_BASE64 not set; skipping signing."
            echo "SIGNING_AVAILABLE=false" >> $GITHUB_ENV
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" \
            -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          echo "SIGNING_AVAILABLE=true" >> $GITHUB_ENV
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

      - name: Sign version .app (macOS)
        if: runner.os == 'macOS' && env.SIGNING_AVAILABLE == 'true'
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          APP="BabelBrain/dist/version/BabelBrain.app"
          ENTITLEMENTS="BabelBrain/entitlements.plist"
          codesign --deep --force --options=runtime --timestamp \
            --entitlements "$ENTITLEMENTS" \
            --sign "$SIGN_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Notarize and staple version .app (macOS)
        if: runner.os == 'macOS' && env.SIGNING_AVAILABLE == 'true'
        env:
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
        run: |
          APP="BabelBrain/dist/version/BabelBrain.app"
          ZIP="$RUNNER_TEMP/BabelBrain-version-app.zip"
          /usr/bin/ditto -c -k --keepParent "$APP" "$ZIP"
          xcrun notarytool submit "$ZIP" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD" \
            --wait
          xcrun stapler staple "$APP"
          spctl --assess --type execute --verbose=4 "$APP" || true

      - name: Package relocatable version zip + sha256 (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          # keepParent so the archive's top-level entry is BabelBrain.app,
          # which the Hub extracts straight into <root>/<build_id>/BabelBrain.app.
          ZIP="artifacts/${{ matrix.artifact_name }}-version.zip"
          /usr/bin/ditto -c -k --keepParent "BabelBrain/dist/version/BabelBrain.app" "$ZIP"
          shasum -a 256 "$ZIP" | awk '{print $1}' > "$ZIP.sha256"
          cat "$ZIP.sha256"

      # --------------------------------------------------------------------
      # Build the Hub launcher, then nest the (signed) version inside it.
      # --------------------------------------------------------------------
      - name: Build Hub launcher (PyInstaller)
        working-directory: BabelBrain
        run: |
          pyinstaller BabelBrainHub.spec --noconfirm --clean \
            --distpath dist/hub --workpath build/hub

      - name: Sign Hub's own frameworks (macOS)
        # Sign the Hub's own nested dylibs/frameworks BEFORE nesting the version,
        # so the version's existing signature+ticket are not touched by --deep.
        if: runner.os == 'macOS' && env.SIGNING_AVAILABLE == 'true'
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          APP="BabelBrain/dist/hub/BabelBrain.app"
          ENTITLEMENTS="BabelBrain/entitlements.plist"
          codesign --deep --force --options=runtime --timestamp \
            --entitlements "$ENTITLEMENTS" \
            --sign "$SIGN_IDENTITY" "$APP"

      - name: Nest version into Hub (macOS)
        if: runner.os == 'macOS'
        run: |
          DEST="BabelBrain/dist/hub/BabelBrain.app/Contents/Resources/bundled"
          mkdir -p "$DEST"
          # ditto preserves the nested app's signature and notarization ticket.
          /usr/bin/ditto "BabelBrain/dist/version/BabelBrain.app" "$DEST/BabelBrain.app"

      - name: Seal + notarize + staple Hub (macOS)
        if: runner.os == 'macOS' && env.SIGNING_AVAILABLE == 'true'
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
        run: |
          APP="BabelBrain/dist/hub/BabelBrain.app"
          ENTITLEMENTS="BabelBrain/entitlements.plist"
          # Re-seal the TOP-LEVEL bundle only (no --deep) so CodeResources now
          # covers the freshly nested version, without re-signing it.
          codesign --force --options=runtime --timestamp \
            --entitlements "$ENTITLEMENTS" \
            --sign "$SIGN_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          ZIP="$RUNNER_TEMP/BabelBrain-hub.zip"
          /usr/bin/ditto -c -k --keepParent "$APP" "$ZIP"
          xcrun notarytool submit "$ZIP" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD" \
            --wait
          xcrun stapler staple "$APP"
          spctl --assess --type execute --verbose=4 "$APP" || true

      - name: Build signed PKG installer (macOS)
        if: runner.os == 'macOS' && env.SIGNING_AVAILABLE == 'true'
        env:
          INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGN_IDENTITY }}
        run: |
          mkdir -p artifacts
          VERSION=$(cat BabelBrain/version.txt)
          STAGE="$RUNNER_TEMP/pkg_root"
          mkdir -p "$STAGE/Applications"
          # The Hub (which contains the nested version) is what gets installed.
          /usr/bin/ditto "BabelBrain/dist/hub/BabelBrain.app" "$STAGE/Applications/BabelBrain.app"
          productbuild \
            --identifier com.ucalgary.babelbrain.pkg \
            --version "$VERSION" \
            --sign "$INSTALLER_IDENTITY" \
            --timestamp \
            --root "$STAGE" / \
            "artifacts/${{ matrix.artifact_name }}.pkg"

      - name: Notarize and staple PKG (macOS)
        if: runner.os == 'macOS' && env.SIGNING_AVAILABLE == 'true'
        env:
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
        run: |
          PKG="artifacts/${{ matrix.artifact_name }}.pkg"
          xcrun notarytool submit "$PKG" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD" \
            --wait
          xcrun stapler staple "$PKG"

      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Build DMG containing the signed PKG installer (macOS)
        if: runner.os == 'macOS' && env.SIGNING_AVAILABLE == 'true'
        run: |
          mkdir -p artifacts
          STAGE="$RUNNER_TEMP/dmg_stage"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          # The PKG is the install entry point; users double-click it.
          cp "artifacts/${{ matrix.artifact_name }}.pkg" "$STAGE/BabelBrain.pkg"
          # Extras alongside the installer for reference/manual copy.
          mkdir -p "$STAGE/Profiles" "$STAGE/PlanningModels"
          cp -R Profiles/* "$STAGE/Profiles/" 2>/dev/null || true
          cp -R PlanningModels/* "$STAGE/PlanningModels/" 2>/dev/null || true
          cp LICENSE "$STAGE/" 2>/dev/null || true
          DMG="artifacts/${{ matrix.artifact_name }}.dmg"
          create-dmg \
            --volname "BabelBrain Installer" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "BabelBrain.pkg" 200 190 \
            "$DMG" \
            "$STAGE/"

      - name: Sign, notarize and staple DMG (macOS)
        if: runner.os == 'macOS' && env.SIGNING_AVAILABLE == 'true'
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
        run: |
          DMG="artifacts/${{ matrix.artifact_name }}.dmg"
          codesign --force --timestamp --sign "$SIGN_IDENTITY" "$DMG"
          codesign --verify --verbose=2 "$DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD" \
            --wait
          xcrun stapler staple "$DMG"

      - name: Build unsigned DMG (macOS, no signing secrets)
        # Fallback so pipeline testing without signing secrets still yields a DMG.
        if: runner.os == 'macOS' && env.SIGNING_AVAILABLE != 'true'
        run: |
          mkdir -p artifacts
          STAGE="$RUNNER_TEMP/dmg_stage_unsigned"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          /usr/bin/ditto "BabelBrain/dist/hub/BabelBrain.app" "$STAGE/BabelBrain.app"
          create-dmg \
            --volname "BabelBrain Installer (unsigned)" \
            --window-pos 200 120 --window-size 800 400 --icon-size 100 \
            --icon "BabelBrain.app" 200 190 \
            "artifacts/${{ matrix.artifact_name }}.dmg" "$STAGE/" || \
          hdiutil create -volname "BabelBrain (unsigned)" -srcfolder "$STAGE" \
            -ov -format UDZO "artifacts/${{ matrix.artifact_name }}.dmg"

      # --------------------------------------------------------------------
      # Windows: nest the version into the Hub, then build the Inno installer.
      # The installer is now PER-USER (no admin) so locked-down research
      # machines can install without elevation.
      # --------------------------------------------------------------------
      - name: Nest version into Hub (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: BabelBrain
        run: |
          $dest = "dist\hub\BabelBrain\bundled"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          # Copy the onedir *contents* so bundled\BabelBrain.exe sits directly
          # under bundled\ (matches paths.bundled_version_dir on Windows).
          Copy-Item -Path "dist\version\BabelBrain\*" -Destination $dest -Recurse -Force

      - name: Package relocatable version zip + sha256 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: BabelBrain
        run: |
          New-Item -ItemType Directory -Force -Path ..\artifacts | Out-Null
          $zip = "..\artifacts\${{ matrix.artifact_name }}-version.zip"
          # Archive the onedir CONTENTS at the zip root so the Hub extracts
          # straight into <root>\<build_id>\BabelBrain.exe.
          Compress-Archive -Path "dist\version\BabelBrain\*" -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$zip.sha256" -Value $hash -NoNewline
          Write-Host "sha256: $hash"

      - name: Build Inno Setup installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: BabelBrain
        run: |
          $version = (Get-Content version.txt -Raw).Trim()
          Write-Host "Building Inno Setup installer for version $version"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Diagnostic — searching for ISCC.exe:"
            Get-ChildItem "C:\Program Files\","C:\Program Files (x86)\" -Filter "Inno*" -EA SilentlyContinue | Format-Table
            throw "ISCC.exe not found at $iscc — runner image may have changed."
          }
          & $iscc "/DAppVersion=$version" BabelBrain.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC.exe failed: exit $LASTEXITCODE" }
          New-Item -ItemType Directory -Force -Path ..\artifacts | Out-Null
          # OutputBaseFilename in BabelBrain.iss is "BabelBrain-Setup".
          Move-Item "BabelBrain-Setup.exe" "..\artifacts\${{ matrix.artifact_name }}.exe"
          Get-Item "..\artifacts\${{ matrix.artifact_name }}.exe" | Select-Object FullName, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          # Installer (Windows .exe, macOS .dmg) plus the relocatable version
          # zip + its sha256 that the Hub downloads and verifies.
          path: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*-version.zip
            artifacts/*-version.zip.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # On tag push, name & tag come from the tag automatically.
          # Always create as draft so we can review and add release notes
          # before publishing.
          draft: true
          generate_release_notes: true
          files: |
            dist-artifacts/**/*.exe
            dist-artifacts/**/*.dmg
            dist-artifacts/**/*-version.zip
            dist-artifacts/**/*-version.zip.sha256
