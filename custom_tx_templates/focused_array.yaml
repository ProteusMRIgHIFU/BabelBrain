# =============================================================================
# BabelBrain custom transducer template: focused_array
# Template Version: 1.0
#
# Circular elements on a spherical cap, each aimed at the geometric focus,
# steerable in x, y and z.
# Coordinate origin: the geometric focus (centre of curvature of the cap).
# Element z positions are measured from the focus back towards the transducer, so z > 0.
# Units: lengths in metres (m), angles in degrees, frequencies in hertz (Hz).
# Scientific notation needs a decimal point and a signed exponent (e.g. 7.0e-2),
# otherwise it is read as text. Plain decimals (0.070) are safest.
#
# The values below reproduce the built-in H317 transducer (128 elements).
# =============================================================================

# ---------- Common parameters ------------------------------------------------
name: MyFocusedArrayTx                  # Unique name: must start with a letter; letters, digits, '_' and '-' only (no spaces)
geometry_type: focused_array
frequencies:                            # Operating frequencies (Hz): 200-1000 kHz in 5 kHz steps, no duplicates
    - 250000
    - 825000
aperture_size: 0.160                    # Aperture width (m), full extent of the active surface
focal_length: 0.135                     # Radius of curvature of the cap (m). Every element lies on a sphere of this radius around the focus.

# Optional. Give one of these (or both, if consistent); the other is calculated from:
#   distance_outplane_to_focus = focal_length - bowl depth - distance_tx_bottom_to_outplane
distance_outplane_to_focus: 0.025      # Device edge (out-plane) to focal spot (m)
# distance_tx_bottom_to_outplane: 0.08587810808696594     # Dead space (m), transducer rim to device edge. Default 0

# ---------- Type-specific parameters -----------------------------------------
num_elements: 128                       # Number of elements
element_size: 0.0095                    # Diameter of each circular element (m). Element centres must be at least element_size / focal_length radians apart.
element_coordinate_system: cartesian    # How element positions are given below: spherical or cartesian

# Element centre positions, num_elements entries each, relative to the focus.
#
