# =============================================================================
# BabelBrain custom transducer template: flat_array_2D
# Template Version: 1.0
#
# Square elements in a single flat plane, steerable in x, y and z.
# Coordinate origin: centre of the array, in the plane of the element faces.
# x, y are lateral; +z points from the transducer towards the target.
# Units: lengths in metres (m), frequencies in hertz (Hz).
# Scientific notation needs a decimal point and a signed exponent (e.g. 3.0e-3),
# otherwise it is read as text. Plain decimals (0.003) are safest.
# =============================================================================

# ---------- Common parameters ------------------------------------------------
# Example values reproduce the built-in REMOPD transducer (256 elements, 58 mm aperture).
name: MyFlatArray2DTx                   # Unique name: must start with a letter; letters, digits, '_' and '-' only (no spaces)
geometry_type: flat_array_2D
frequencies:                            # Operating frequencies (Hz): 200-1000 kHz in 5 kHz steps, no duplicates
    - 490000
aperture_size: 0.058                    # Aperture width (m), full extent of the active surface
# focal_length is NOT needed: flat arrays have no natural focus (set internally to 1.0e3 m)

# ---------- Type-specific parameters -----------------------------------------
distance_elements_to_outplane: 0.0012   # Optional dead space (m), element surface to device edge. Default 0. Do not add to elements.z
num_elements: 256                       # Number of elements
element_size: 0.00258                   # Side length of each square element (m). Element centres must be at least this far apart.

